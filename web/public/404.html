<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050403">
    <title>404 — Page not found | Sun Shade</title>
    <link rel="icon" href="/favicon.png">
    <style>
      :root {
        color-scheme: dark;
        --background: #050403;
        --amber: #ffbf47;
        --sun: #fff0c2;
        --muted: #cfb891;
        --mono: ui-monospace, "SF Mono", Consolas, monospace;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        background: radial-gradient(ellipse at center, #1a1208 0%, transparent 65%),
          repeating-linear-gradient(0deg, #ffb00009 0 1px, transparent 1px 4px), var(--background);
        color: var(--sun);
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(100%, 440px);
        text-align: center;
      }

      .code {
        display: block;
        margin-bottom: 16px;
        color: var(--amber);
        font: 700 clamp(80px, 20vw, 136px)/.9 var(--mono);
        letter-spacing: -.07em;
      }

      h1 {
        margin: 0;
        font-size: clamp(25px, 6vw, 36px);
        line-height: 1.15;
        letter-spacing: -.03em;
        text-wrap: balance;
      }

      .description {
        margin: 16px auto 28px;
        max-width: 36ch;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.6;
      }

      .return {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        gap: 18px;
        padding: 0 16px;
        border: 1px solid var(--amber);
        background: var(--amber);
        color: #140d00;
        font: 700 14px/1.3 var(--mono);
        text-decoration: none;
      }

      .return:hover { background: var(--sun); }
      .return:focus-visible { outline: 2px solid var(--sun); outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="code">404</span> Page not found</h1>
      <p class="description">The link may be broken or the page may have moved.</p>
      <a class="return" href="/compare"><span aria-hidden="true">←</span> Return to planner</a>
    </main>
  </body>
</html>
