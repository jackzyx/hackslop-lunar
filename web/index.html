<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sun Shade</title>
    <link rel="icon" href="/favicon.png" />
    <meta name="theme-color" content="#050403" />
    <style>
      /* Critical first-paint styles: do not wait for the JavaScript CSS bundle. */
      html,body{margin:0;background:#050403;color:#ffbf47;color-scheme:dark}
      [hidden]{display:none!important}
      .planner-loading{position:fixed;inset:0;display:grid;place-items:center;margin:0;font:14px monospace}
      body:has(.intro:not([hidden])) .planner-loading{visibility:hidden}
      .intro{position:fixed;inset:0;z-index:50;background:#000}
      .intro canvas{position:absolute;inset:0;width:100%;height:100%}
      .intro .skip{position:absolute;top:16px;right:16px;background:#0a0805;color:#ffbf47;border:1px solid #59400e;padding:6px 12px;font:12px monospace;cursor:pointer}
      .intro-line{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);width:min(780px,calc(100% - 68px));padding:12px 18px;background:#000c;border:1px solid #382600;font:22px sans-serif;color:#ffd98a}
      #intro-boot{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
      .intro:not([data-phase]) .intro-line,.intro[data-phase="waiting"] .intro-line{display:none}
      .intro-initialise{position:absolute;z-index:1;left:50%;bottom:max(42px,8vh);transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:12px 8px;border:0;background:transparent;color:#ffb000;font:clamp(12px,2vw,18px) monospace;letter-spacing:.12em;cursor:pointer;animation:initialise-blink 1.6s step-end infinite}
      .intro[data-initialised] .intro-initialise,.intro[data-phase]:not([data-phase="waiting"]) .intro-initialise{display:none}
      @keyframes initialise-blink{0%,100%{opacity:1}50%{opacity:.25}}
      @media(prefers-reduced-motion:reduce){.intro-initialise{animation:none}}
    </style>
    <script>
      if (/\/(privacy|terms)$/.test(location.pathname)) {
        document.documentElement.dataset.policyPage = '';
      } else {
        for (const [href, fetchPriority] of [['./terrain_500m.bin', 'auto'], ['./moon-albedo-4k.jpg', 'low']]) {
          const link = document.createElement('link');
          link.rel = 'preload';
          link.href = href;
          link.as = 'fetch';
          link.crossOrigin = 'anonymous';
          link.fetchPriority = fetchPriority;
          document.head.append(link);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"><p class="planner-loading" role="status">Loading planner…</p></div>
    <!-- Intro (src/intro/intro.js). Plain HTML outside React so it covers the page from the first paint. -->
    <div class="intro" id="intro">
      <div id="intro-boot" aria-hidden="true"></div>
      <button type="button" class="intro-initialise">[PRESS ANY KEY TO INITIALISE]</button>
      <div class="intro-scene" aria-hidden="true"><canvas></canvas></div>
      <p class="intro-line"><span></span></p>
      <button type="button" class="skip">Skip intro</button>
    </div>
    <script>
      const introSkip = document.querySelector('#intro .skip');
      // The intro plays on the first visit only, unless turned on in the footer ('always'); flag set in main.jsx.
      try { if (localStorage.getItem('sun-shade-intro') === 'seen') { const intro = document.getElementById('intro'); intro.dataset.bootSkipped = 'true'; intro.hidden = true; } } catch {}
      if ('policyPage' in document.documentElement.dataset) {
        document.getElementById('intro').hidden = true;
        document.querySelector('.planner-loading').textContent = 'Loading page.';
      }
      introSkip.addEventListener('click', () => {
        const intro = document.getElementById('intro');
        if (intro.dataset.phase) return;
        intro.dataset.bootSkipped = 'true';
        intro.hidden = true;
        intro.dispatchEvent(new Event('intro:skip'));
      });
      function initialiseIntro() {
        const intro = document.getElementById('intro');
        if (intro.hidden || (intro.dataset.phase && intro.dataset.phase !== 'waiting') || intro.dataset.initialised) return;
        intro.dataset.initialised = 'true';
        intro.dispatchEvent(new Event('intro:initialise'));
      }
      document.querySelector('.intro-initialise').addEventListener('click', initialiseIntro);
      addEventListener('keydown', event => {
        if (event.key === 'F11' || event.code === 'F11' || event.key === 'Fn') return;
        const intro = document.getElementById('intro');
        if (intro.hidden || (intro.dataset.phase && intro.dataset.phase !== 'waiting') || intro.dataset.initialised) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        initialiseIntro();
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
